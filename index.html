<style>


/* ZENIT Stylesheet
   Aufgeraeumt: ueberschriebene Deklarationen entfernt, doppelte Regeln zusammengefuehrt,
   unnoetige !important entfernt. Reihenfolge = Kaskade, nicht umsortieren ohne Test-Suite. */
[hidden]{
  display:none !important;
}
*{
  box-sizing:border-box;
}
button,input,select{
  font:inherit;
  color:inherit;
}
button{
  cursor:pointer;
  border:0;
  background:none;
  padding:0;
}
:focus-visible{
  outline:3px solid var(--tx);
  outline-offset:2px;
}
body[data-v="s"]{
  --ac:var(--red);
}
body[data-v="p"]{
  --ac:var(--red);
}
#home{
  position:relative;
  min-height:100%;
}
#inner{
  padding-inline:16px;
  padding-block:0 112px;
}
.top{
  display:flex;
  align-items:center;
  gap:6px;
  padding-block:14px 8px;
}
.top button{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  font:800 22px/1 var(--fd);
  letter-spacing:.14em;
  text-transform:uppercase;
}
.top svg{
  width:22px;
  height:22px;
  color:var(--mute);
}
.eyebrow{
  margin:10px 0 0;
}
h1{
  margin:6px 0 0;
  font:800 clamp(40px,12vw,56px)/1 var(--fd);
  text-wrap:balance;
}
.sub{
  margin:6px 0 0;
  font-size:15px;
}
.stack{
  display:flex;
  flex-direction:column;
}
.card{
  min-width:0;
}
.lvname{
  font:800 clamp(22px,6.4vw,28px)/1.05 var(--fd);
}
.xpbar{
  border-radius:99px;
  margin:10px 0 8px;
  overflow:hidden;
}
.xpbar i{
  display:block;
  height:100%;
  border-radius:99px;
}
.wk{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:16px;
}
.wd{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font:600 12px/1 var(--fb);
  color:var(--mute);
  letter-spacing:.06em;
}
.wd.today i{
  box-shadow:0 0 0 2px var(--fg) inset;
}
.wd.on.today i{
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac);
}
form.f{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field label{
  font-size:14px;
  color:var(--mute);
}
input:focus,select:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent);
}
.pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btns{
  display:flex;
  gap:10px;
}
.btns .btn{
  flex:1;
}
.err{
  margin:0;
  color:#ff8a8a;
  font-size:14px;
}
.prev{
  margin:0;
  font-size:14px;
}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  min-width:0;
}
.when{
  flex:none;
  min-width:64px;
  color:var(--mute);
  font:600 14px/1.2 var(--fb);
  font-variant-numeric:tabular-nums;
}
.grow{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}
.grow small{
  display:block;
  margin-top:2px;
  color:var(--mute);
  font-size:13px;
}
.grow small b{
  color:var(--fg);
  font-weight:600;
}
.ico{
  flex:none;
  width:38px;
  height:44px;
  display:grid;
  place-items:center;
  color:var(--mute);
  border-radius:10px;
}
.ico svg{
  width:18px;
  height:18px;
}
.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:16px;
}
.tile{
  min-width:0;
}
.tile span{
  display:flex;
  align-items:center;
  gap:6px;
}
.tile span i{
  width:8px;
  height:8px;
  border-radius:50%;
  flex:none;
}
.tile b{
  display:block;
  margin-top:8px;
  font:800 30px/1 var(--fd);
}
.empty{
  margin:24px 0 0;
  color:var(--mute);
}
.tabs{
  position:fixed;
  z-index:10;
}
.tab[data-v="g"]{
  --c:var(--red);
}
.tab[data-v="home"]{
  --c:var(--tx);
}
.tab[data-v="s"]{
  --c:var(--red);
}
.tab[data-v="a"]{
  --c:var(--green);
}
.tab[data-v="h"]{
  --c:var(--pur);
}
.tab[data-v="x"]{
  --c:var(--amber);
}
.mst{
  flex:none;
  font:700 11px/1 var(--fb);
  padding:6px 9px;
  border-radius:99px;
}
.mwk{
  position:relative;
  height:8px;
  margin:12px 0 6px;
  border-radius:99px;
  background:rgba(var(--wh),.12);
  overflow:hidden;
}
.mwk i{
  display:block;
  height:100%;
  border-radius:99px;
}
.mwk u{
  position:absolute;
  top:0;
  bottom:0;
  left:40%;
  width:40%;
  border-left:2px solid rgba(var(--wh),.35);
  border-right:2px solid rgba(var(--wh),.35);
}
.mwl{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--mute);
}
.mex{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--edge);
}
.mex span{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:14px;
}
.mex em{
  font-style:normal;
  color:var(--mute);
  font-size:13px;
  white-space:nowrap;
}
.xhead{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:20px;
}
.chips.mf{
  flex-wrap:nowrap;
  overflow-x:auto;
  margin:0 -16px;
  padding:2px 16px;
  scrollbar-width:none;
}
.chips.mf::-webkit-scrollbar{
  display:none;
}
.chips.mf .chip{
  flex:none;
}
.chips.mf .chip.on{
  border-color:var(--ac);
}
.tab[data-v="p"]{
  --c:var(--red);
}
.sheet .panel{
  width:100%;
  max-width:560px;

.kpm{--g:3px;--pt:16px;position:relative;align-self:start;padding:var(--pt) 40px 12px 10px;border-radius:20px;background:linear-gradient(90deg,#121112,#1c1b1b 45%,#151414);border:1px solid var(--rule);box-shadow:inset 0 2px 12px rgba(0,0,0,.6);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}

(function(){

  }
  window.addEventListener('resize',track);
  document.addEventListener('focusout',function(e){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))setTimeout(remeasure,160)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(remeasure,200)});
